# 프리픽스를 Ctrl+a로 변경
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# mouse on — pane-aware selection (ghostty 단독은 pane 경계 무시함)
set -g mouse on

# 이미지/확장 키보드 프로토콜 통과 (image.nvim, kitty keyboard 등)
set -g allow-passthrough on

# prefix + T → sesh 세션 picker (tmux 세션 + zoxide 디렉토리 fzf 검색)
bind T display-popup -E -w 60% -h 60% "sesh connect \"\$(sesh list | fzf)\""

# 윈도우 번호를 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 윈도우를 닫으면 번호를 재정렬
set -g renumber-windows on

# 스크롤 버퍼 크기 늘리기
set -g history-limit 10000

# Escape 키 지연 제거 (Vim 사용자 필수)
set -sg escape-time 0

# 256 색상 + true color 지원 (Ghostty)
# tmux-256color-rgb 는 ~/.terminfo 에 설치된 커스텀 entry (Tc cap 추가)
set -g default-terminal "tmux-256color-rgb"
set -as terminal-features ",xterm-ghostty:RGB"

# 직관적인 분할 단축키 (분할 후 형제 pane 만 균등 — 다른 방향 split 은 보존). \\ 는 shift 불필요.
bind \\ split-window -h -c "#{pane_current_path}" \; select-layout -E
bind - split-window -v -c "#{pane_current_path}" \; select-layout -E

# pane 닫혔을 때 자동 균등 재배분
set-hook -g pane-exited 'select-layout -E'

# Cmd+K 가 보내는 시퀀스 (Alt+l) → 현재 pane 의 visible+scrollback 모두 비움
# -R 은 tmux 내부 터미널 에뮬레이터 상태 리셋 (stdin 우회 → tail -f 등 foreground 프로세스에서도 동작)
# claude code 실행 중 pane 은 예외 — -R 로 visible 비우면 claude UI 가 빈 화면으로 남음 (claude 가 redraw 안 함)
bind -n M-l if-shell -F '#{m/r:^2\.,#{pane_current_command}}' \
  'display "Claude pane — use /clear instead"' \
  'send-keys -R ; clear-history'

# prefix + Tab → layout 순환 (가로↔세로↔main↔tiled)
bind Tab next-layout

# prefix + ; → 이전 pane (cycle, Cmd+[ 가 보내는 시퀀스). 기본은 last-pane (토글) 이라 비대칭
bind ";" select-pane -t :.-
unbind '"'
unbind %

# 새 윈도우도 현재 디렉토리에서 열기
bind c new-window -c "#{pane_current_path}"

# Vim 스타일 패널 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix + 0 → 직전 윈도우 (default 'l' 이 vim pane 이동에 점유당해 대체 키 사용. Cmd+9 의 ghostty 매핑 짝)
bind 0 last-window

# prefix + a → 현재 pane 전체(scrollback 포함) 클립보드 복사 ("전체 선택+복사" 대용. ghostty select_all 은 tmux 안에서 무용)
# TPM(line 170) 전에 미리 set → tmux-sensible 의 'prefix a = last-window' 가 key_binding_not_set 조건으로 skip 됨 (last-window 미사용이라 의도된 override)
bind a run-shell "tmux capture-pane -pJS -100000 | pbcopy" \; display "pane 전체 클립보드 복사됨"

# 윈도우 위치 이동: prefix + Shift+Left/Right 로 좌/우 swap (-r 로 연속 가능)
bind -r S-Left  swap-window -t -1 \; previous-window
bind -r S-Right swap-window -t +1 \; next-window

# 패널 크기 조절
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# shift enter in claude code
bind-key -T root S-Enter send-keys C-j

# 셸이 윈도우 이름을 덮어쓰지 못하게 고정
set -g allow-rename off

# 설정 파일 다시 불러오기
bind r source-file ~/.tmux.conf \; display "설정을 다시 불러왔습니다!"

# prefix + J → 현재 window 를 다른 window 로 병합 (! 의 반대 방향)
bind J command-prompt -p "merge current window into:" \
  "run-shell '~/.claude/hooks/tmux-merge-window.sh #{window_id} %%'"

# Copy 모드에서 vi 스타일 단축키 사용
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 드래그/더블클릭/트리플클릭 → 선택 후 macOS 클립보드(pbcopy) 자동 복사
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel pbcopy }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel pbcopy }
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel pbcopy

# active pane 의 border 강조 + 화살표 인디케이터 + 위쪽 제목 바
set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=yellow"
set -g pane-border-indicators both
set -g pane-border-status top
# Claude 가 pane_title 설정 안 했으면(= hostname 그대로) 디렉토리 basename 표시
set -g pane-border-format " #{?pane_active,#[fg=yellow]●,#[fg=colour244]○} #{pane_index}: #{?#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_title},}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_title}} "

# 백그라운드 pane 출력 발생 시 status bar 깜빡임 (긴 작업 완료 알림용)
set -g monitor-activity on
set -g visual-activity off

# 마우스 더블클릭 단어 선택 — 공백만 구분자로 (URL, 경로 한 번에 잡힘)
set -g word-separators " "

# 편집기/Claude 의 focus 이벤트 전달
set -g focus-events on

# 상태바 개선 (어두운 배경 + 차분한 색)
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=yellow,bold] #S "
set -g status-left-length 30
# status-interval 은 여기가 아니라 파일 맨 아래(TPM 뒤)에서 설정한다 — 이유는 그 주석 참고
set -g status-right-length 160
set -g @cpu_medium_thresh "60"
set -g @cpu_high_thresh "80"
set -g @cpu_low_fg_color "#[fg=colour76]"
set -g @cpu_medium_fg_color "#[fg=yellow]"
set -g @cpu_high_fg_color "#[fg=colour196]"
set -g @ram_medium_thresh "60"
set -g @ram_high_thresh "80"
set -g @ram_low_fg_color "#[fg=colour76]"
set -g @ram_medium_fg_color "#[fg=yellow]"
set -g @ram_high_fg_color "#[fg=colour196]"
set -g @batt_color_full_charge "#[fg=colour76]"
set -g @batt_color_high "#[fg=colour76]"
set -g @batt_color_medium "#[fg=yellow]"
set -g @batt_color_low "#[fg=colour196]"
# "AC attached but not charging" (macOS Optimized Charging 80% 멈춤) 의 default 가 ⚠️ 라 경고처럼 보임
# → 충전 중 아이콘과 동일하게 🔌 로 통일 (꽂혔으면 🔌, 빠지면 🔋)
set -g @batt_icon_status_attached "🔌"
set -g status-right "#{prefix_highlight} #[fg=colour250]#(~/.claude/hooks/tmux-claude-usage.sh) | CPU:#{cpu_fg_color}#{cpu_percentage}#[fg=colour250] | RAM:#(~/.claude/hooks/tmux-ram.sh) | #{battery_icon} #{battery_color_fg}#{battery_percentage}#[fg=colour250] | %H:%M:%S #(~/.claude/hooks/tmux-weekday.sh)"
set -g window-status-style "fg=colour244"
set -g window-status-current-style "fg=yellow,bold"
set -g window-status-activity-style "fg=colour244"
set -g window-status-bell-style "fg=red,bold"

# 윈도우 리스트 포맷에서 flag(#, - 등) 제거 — 모든 윈도우에 Claude 떠있어서 항상 # 붙음
set -g window-status-format " #(~/.claude/hooks/tmux-claude-window-status.sh #{window_index})[#I]#{?#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_title},}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_title}}"
set -g window-status-current-format " [#I]#{?#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_title},}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_title}}"

# TPM 플러그인 목록
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes '"~claude->claude *"'
set -g @resurrect-hook-post-save-all '~/.claude/hooks/tmux-resurrect-rewrite.sh'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key 'g'   # prefix + g = thumbs (Space 는 which-key 가 사용)
set -g @plugin 'alexwforsythe/tmux-which-key'

# tmux 서버 시작 시 마지막 세션 자동 복원 (continuum)
set -g @continuum-restore 'on'

# TPM 초기화 (파일 맨 아래에 위치해야 함)
run '~/.tmux/plugins/tpm/tpm'

# status-right 는 #() 셸 스크립트를 9개(continuum, claude-usage, cpu x2, ram, battery x3,
# weekday) 돌린다. tmux 는 status 를 다시 그릴 때마다 — 이 타이머뿐 아니라 pane 출력이 있을
# 때마다 — 그 전부를 재평가하므로, 간격이 짧으면 초당 수백 개의 프로세스 생성이 되고 ESET
# on-exec 검사와 sysmond 가 이를 실제 배터리 소모로 증폭시킨다.
# 측정(2026-07-30): 간격 1 에서 425 spawns/sec, 15 에서 196/sec. 다시 1 로 낮추지 말 것.
#
# 반드시 TPM 뒤에 와야 한다. tmux 의 status-interval 기본값이 정확히 15 라서, 위쪽에서
# 설정하면 tmux-sensible 이 "사용자가 손대지 않은 값"으로 판정하고 5 로 덮어쓴다.
set -g status-interval 15

